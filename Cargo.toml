[package]
name = "qmk-layer-indicator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
hidapi = "2.6.6"
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "x11"] }
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }

[target.'cfg(target_os = "macos")'.dependencies]
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = { version = "0.24.2", default-features = false }

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
