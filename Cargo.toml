[package]
name = "qmk-layer-indicator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
egui = "0.36.1"
egui_extras = { version = "0.36.1", default-features = false, features = ["svg"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
include_dir = "0.7.4"
notify = "8"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tungstenite = "0.30"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.6", default-features = false, features = ["linux-native"] }
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }

[target.'cfg(target_os = "macos")'.dependencies]
hidapi = "2.6.6"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
tray-icon = { version = "0.24.2", default-features = false }
winit = { version = "0.30", default-features = false }

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"
