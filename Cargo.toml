[package]
name = "qmk-layer-indicator"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
hidapi = "2.6.6"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "renderer-software"] }
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }
slint = { version = "1.17.1", default-features = false, features = ["unstable-winit-030"] }
x11rb = { version = "0.13", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "1.17.1", default-features = false, features = ["backend-winit"] }
tray-icon = { version = "0.24.2", default-features = false }

[profile.release]
opt-level = "z"
strip = true
lto = "fat"
codegen-units = 1
panic = "abort"

[build-dependencies]
slint-build = "1.17.1"
