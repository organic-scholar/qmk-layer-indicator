name: macOS package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            target: x86_64-apple-darwin
            suffix: x86_64
          - runner: macos-14
            target: aarch64-apple-darwin
            suffix: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Create app bundle and disk image
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          app="dist/QMK Layer Indicator.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/${{ matrix.target }}/release/qmk-layer-indicator" "$app/Contents/MacOS/"

          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "icon.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            sips -z "$double" "$double" assets/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o "$app/Contents/Resources/qmk-layer-indicator.icns"

          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleDisplayName</key><string>QMK Layer Indicator</string>
            <key>CFBundleExecutable</key><string>qmk-layer-indicator</string>
            <key>CFBundleIdentifier</key><string>com.organic-scholar.qmk-layer-indicator</string>
            <key>CFBundleIconFile</key><string>qmk-layer-indicator</string>
            <key>CFBundleName</key><string>QMK Layer Indicator</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          EOF
          hdiutil create -volname "QMK Layer Indicator" -srcfolder dist \
            -ov -format UDZO "qmk-layer-indicator-$version-${{ matrix.suffix }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}-dmg
          path: qmk-layer-indicator-*.dmg
          if-no-files-found: error
